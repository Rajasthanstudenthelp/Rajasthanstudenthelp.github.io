<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, interactive-widget=resizes-content">
    <title>ISB-24 Premium Web3</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { --primary: #3F51B5; --bg: #f0f2f5; --surface: #ffffff; --text: #1c1e21; --border: #e4e6eb; }
        body, html { height: 100dvh; margin: 0; font-family: sans-serif; background: var(--bg); overflow: hidden; }
        #authScreen { height: 100dvh; display:flex; align-items:center; justify-content:center; }
        #mainApp { height: 100dvh; display: flex; flex-direction: column; }
        .app-bar { padding: 15px 20px; background: var(--surface); display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .container { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .list-item { display: flex; align-items: center; padding: 15px; margin: 5px; background: var(--surface); border-radius: 12px; cursor: pointer; }
        .avatar { width: 50px; height: 50px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-weight:bold; flex-shrink:0; }
        .fab { position: fixed; bottom: 85px; right: 20px; width: 60px; height: 60px; background: #25D366; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; }
        .chat-window { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: var(--bg); z-index: 500; flex-direction: column; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-input { background: var(--surface); padding: 10px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
        .bubble { max-width: 80%; padding: 10px 15px; border-radius: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .bubble.sent { align-self: flex-end; background: #DCF8C6; }
        .bubble.received { align-self: flex-start; background: white; }
        .media-viewer { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 9999; flex-direction: column; }
        .status-tray { display: flex; overflow-x: auto; gap: 10px; padding: 15px; }
        .status-card { width: 90px; height: 130px; border-radius: 15px; background-size: cover; position: relative; flex-shrink: 0; border: 2px solid #25D366; }
    </style>
</head>
<body>

<div id="authScreen"><div id="googleButtonContainer"></div></div>

<div id="mainApp" style="display: none;">
    <div class="app-bar"><div>ISB Messenger</div><i class="material-icons" onclick="syncDrive()">sync</i></div>
    <div class="container">
        <div id="chatsTab" class="tab-content active"><div id="chatsList"></div></div>
        <div id="statusTab" class="tab-content"><div class="status-tray" id="statusTray"></div><div id="statusList"></div></div>
    </div>
    <div class="bottom-nav" style="background:var(--surface); display:flex; justify-content:space-around; padding:15px; border-top:1px solid #ddd;">
        <div onclick="switchNav('chatsTab')"><i class="material-icons">chat</i></div>
        <div onclick="switchNav('statusTab')"><i class="material-icons">donut_large</i></div>
    </div>
    <div class="fab" onclick="openNewChatModal()"><i class="material-icons">add</i></div>
</div>

<div id="chatWindow" class="chat-window">
    <div class="chat-header"><i class="material-icons" onclick="closeChat()">arrow_back</i><div id="chatTitle">User</div></div>
    <div class="chat-messages" id="chatMessagesBox"></div>
    <div class="chat-input">
        <input type="file" id="fileAttachment" style="display:none;" onchange="handleFileSelect(event)">
        <i class="material-icons" onclick="document.getElementById('fileAttachment').click()">add</i>
        <input type="text" id="chatInputMsg" placeholder="Message...">
        <button onclick="sendChatMessage()"><i class="material-icons">send</i></button>
    </div>
</div>

<div id="mediaViewerModal" class="media-viewer">
    <i class="material-icons" style="color:white; padding:20px;" onclick="closeMediaViewer()">close</i>
    <div id="mediaViewerContent" style="flex:1; display:flex; align-items:center; justify-content:center;"></div>
</div>

<script>
    const database = firebase.initializeApp({apiKey: "AIzaSyA-d_mtHg1Age9ZggTWF3ABhUd_xn2PDKM", databaseURL: "https://isb-messenger-75093-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "isb-messenger-75093", storageBucket: "isb-messenger-75093.firebasestorage.app", messagingSenderId: "970755431087", appId: "1:970755431087:web:09171e2ebca48e1b91125a"}).database();
    let APP_STATE = { msgs: [], statuses: [] };
    let currentUserEmail = localStorage.getItem("isb_email");
    let currentChatContact = null;

    function showMainApp() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        syncDrive();
    }

    function syncDrive() {
        database.ref('messages').on('value', snap => {
            APP_STATE.msgs = Object.values(snap.val() || {});
            loadChatsList();
        });
    }

    function openChat(contact) {
        currentChatContact = contact;
        document.getElementById('chatTitle').innerText = contact;
        document.getElementById('chatWindow').style.display = 'flex';
        renderChatMessages();
    }

    function renderChatMessages() {
        let box = document.getElementById('chatMessagesBox');
        box.innerHTML = "";
        APP_STATE.msgs.forEach(m => {
            if((m.from === currentUserEmail && m.to === currentChatContact) || (m.from === currentChatContact && m.to === currentUserEmail)) {
                let div = document.createElement('div');
                div.className = "bubble " + (m.from === currentUserEmail ? "sent" : "received");
                div.innerText = m.text;
                box.appendChild(div);
            }
        });
    }

    async function sendChatMessage() {
        let input = document.getElementById('chatInputMsg');
        let msg = input.value;
        if(!msg) return;
        database.ref('messages').push({ from: currentUserEmail, to: currentChatContact, text: msg, time: Date.now() });
        input.value = "";
    }

    function closeChat() { document.getElementById('chatWindow').style.display = 'none'; }
    function switchNav(tab, el) { 
        document.querySelectorAll('.tab-content').forEach(t => t.style.display='none');
        document.getElementById(tab).style.display='block';
    }
    
    // Google Login Callback
    function handleCredentialResponse(response) {
        let base64 = response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        currentUserEmail = JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''))).email;
        localStorage.setItem("isb_email", currentUserEmail);
        showMainApp();
    }

    // Initialize Login
    google.accounts.id.initialize({ client_id: "1091629496669-5881hgv7d4t01eepcq60u8mmdkguc1cn.apps.googleusercontent.com", callback: handleCredentialResponse });
    google.accounts.id.renderButton(document.getElementById("googleButtonContainer"), { theme: "filled_blue", size: "large" });
    if(currentUserEmail) showMainApp();
</script>
</body>
</html>
