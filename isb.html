<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, interactive-widget=resizes-content">
    <title>ISB-24 Full Web3 Messenger</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* [FULL CSS RE-INTEGRATED] */
        :root { --primary: #3F51B5; --bg: #f0f2f5; --surface: #ffffff; --text: #1c1e21; --border: #e4e6eb; }
        [data-theme="dark"] { --primary: #5C6BC0; --bg: #121212; --surface: #1e1e1e; --text: #e4e6eb; --border: #333333; }
        body, html { height: 100%; height: 100dvh; overflow: hidden; font-family: sans-serif; background-color: var(--bg); margin: 0; padding: 0; }
        #authScreen { height: 100dvh; display:flex; align-items:center; justify-content:center; }
        #mainApp { height: 100dvh; display: flex; flex-direction: column; }
        .app-bar { flex-shrink: 0; background: var(--surface); padding: 15px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .container { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .list-item { display: flex; align-items: center; padding: 15px; margin: 5px; background: var(--surface); border-radius: 12px; cursor: pointer; }
        .avatar { width: 50px; height: 50px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-weight: bold; }
        .fab { position: fixed; bottom: 80px; right: 20px; width: 60px; height: 60px; background: #25D366; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .chat-window { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: var(--bg); z-index: 500; flex-direction: column; }
        .chat-header { flex-shrink: 0; background: var(--surface); padding: 10px; display: flex; align-items: center; border-bottom: 1px solid var(--border); }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-input { flex-shrink: 0; background: var(--surface); padding: 10px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
        .bubble { max-width: 80%; padding: 10px 15px; border-radius: 15px; }
        .bubble.sent { align-self: flex-end; background: #DCF8C6; }
        .bubble.received { align-self: flex-start; background: white; border: 1px solid var(--border); }
        .media-viewer { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 9999; flex-direction: column; }
        .status-tray { display: flex; overflow-x: auto; gap: 10px; padding: 15px; }
        .status-card { width: 90px; height: 130px; border-radius: 15px; background-size: cover; position: relative; flex-shrink: 0; border: 2px solid #25D366; }
    </style>
</head>
<body data-theme="default">

<div id="authScreen"><div id="googleButtonContainer"></div></div>

<div id="mainApp" style="display: none;">
    <div class="app-bar"><div>ISB Messenger</div><i class="material-icons" onclick="syncDrive()">sync</i></div>
    <div class="container">
        <div id="chatsTab" class="tab-content active"><div id="chatsList"></div></div>
        <div id="statusTab" class="tab-content">
            <div class="status-tray" id="statusTray"></div>
            <div id="statusList"></div>
        </div>
    </div>
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchNav('chatsTab', this)"><i class="material-icons">chat_bubble</i><span>Chats</span></div>
        <div class="nav-item" onclick="switchNav('statusTab', this)"><i class="material-icons">donut_large</i><span>Status</span></div>
    </div>
    <div class="fab" onclick="openNewChatModal()"><i class="material-icons">add</i></div>
</div>

<!-- Media Viewer -->
<div id="mediaViewerModal" class="media-viewer">
    <div style="padding:20px; color:white; display:flex; justify-content:space-between;">
        <i class="material-icons" onclick="closeMediaViewer()">close</i>
        <i class="material-icons" id="mediaDownloadBtn">download</i>
    </div>
    <div id="mediaViewerContent" style="flex:1; display:flex; align-items:center; justify-content:center;"></div>
</div>

<script>
    // --- WORKER CODE (THE "GARBAGE" ENCRYPTION SYSTEM) ---
    const keyWorkerCode = `self.onmessage=function(e){let pwd=e.data.password;let salt=new Uint8Array(e.data.salt);let bigKey=new Uint8Array(128);for(let i=0;i<128;i++){bigKey[i]=pwd.charCodeAt(i%pwd.length)^salt[i%salt.length]^(i%256);}self.postMessage({bigKey:bigKey.buffer},[bigKey.buffer]);};`;
    const mathWorkerCode = `self.onmessage=function(e){let buffer=new Uint8Array(e.data.buffer);let isEncrypt=e.data.action==='encrypt';let bigKey=new Uint8Array(e.data.bigKey);let chunkIdx=e.data.chunkIdx;let G1=0x12345678,G2=0x87654321,G3=0xDEADBEEF,G4=0xCAFEBABE;for(let i=0;i<128;i++){let c=bigKey[i];G1=(G1>>>1)^(c<<24);G2=(G2<<3)^c;G3^=(G1>>>5);G4=(G4<<1)^(G2>>>2);}G1^=chunkIdx;G2^=(Math.imul(chunkIdx,13)>>>0);G3^=(Math.imul(chunkIdx,17)>>>0);G4^=(Math.imul(chunkIdx,19)>>>0);let dv=new DataView(buffer.buffer,buffer.byteOffset,buffer.byteLength);let words=Math.floor(buffer.length/4);let baseWordIndex=chunkIdx*1048576;for(let i=0;i<words;i++){let sizeNum=baseWordIndex+i+1;let x=sizeNum;let x2=Math.imul(x,x)>>>0;let x3=Math.imul(x2,x)>>>0;let x4=Math.imul(x3,x)>>>0;let x5=Math.imul(x4,x)>>>0;let x6=Math.imul(x5,x)>>>0;let x7=Math.imul(x6,x)>>>0;let x8=Math.imul(x7,x)>>>0;let pMode=bigKey[sizeNum%128]%6;let powerVal=(x3&((pMode===0)?0xFFFFFFFF:0))|(x4&((pMode===1)?0xFFFFFFFF:0))|(x5&((pMode===2)?0xFFFFFFFF:0))|(x6&((pMode===3)?0xFFFFFFFF:0))|(x7&((pMode===4)?0xFFFFFFFF:0))|(x8&((pMode===5)?0xFFFFFFFF:0));let pVal=bigKey[(sizeNum+15)%128];let rotInner=(Math.imul(pVal,Math.imul(pVal,pVal))>>>0)%31+1;let rotOuter=(Math.imul(powerVal%1000,powerVal%1000)+rotInner)%31+1;G1=(G1+powerVal)>>>0;G2=(G2^G1)>>>0;G2=((G2<<rotInner)|(G2>>>(32-rotInner)))>>>0;G3=(G3+G2)>>>0;G4=(G4^G3)>>>0;G4=((G4<<rotOuter)|(G4>>>(32-rotOuter)))>>>0;let g32=(G1+G2+G3+G4)>>>0;let y=(g32%10000)+1;let y2=Math.imul(y,y)>>>0;let y3=Math.imul(y2,y)>>>0;let y4=Math.imul(y3,y)>>>0;let y5=Math.imul(y4,y)>>>0;let y6=Math.imul(y5,y)>>>0;let y7=Math.imul(y6,y)>>>0;let y8=Math.imul(y7,y)>>>0;let dpMode=bigKey[(sizeNum+64)%128]%6;let dPowerVal=(y3&((dpMode===0)?0xFFFFFFFF:0))|(y4&((dpMode===1)?0xFFFFFFFF:0))|(y5&((dpMode===2)?0xFFFFFFFF:0))|(y6&((dpMode===3)?0xFFFFFFFF:0))|(y7&((dpMode===4)?0xFFFFFFFF:0))|(y8&((dpMode===5)?0xFFFFFFFF:0));let dpVal=bigKey[(sizeNum+42)%128];let dRotInner=(Math.imul(dpVal,Math.imul(dpVal,dpVal))>>>0)%31+1;let dRotOuter=(Math.imul(dPowerVal%1000,dPowerVal%1000)+dRotInner)%31+1;g32=(g32+dPowerVal)>>>0;g32=(g32^(g32>>>15))>>>0;g32=((g32<<dRotInner)|(g32>>>(32-dRotInner)))>>>0;g32=((g32<<dRotOuter)|(g32>>>(32-dRotOuter)))>>>0;let pwdGarbage=(bigKey[(sizeNum*7)%128])|(bigKey[(sizeNum*11)%128]<<8)|(bigKey[(sizeNum*13)%128]<<16)|(bigKey[(sizeNum*17)%128]<<24);g32=(g32+pwdGarbage)>>>0;g32=(g32^(pwdGarbage>>>7))>>>0;let opMode=bigKey[(sizeNum+32)%128]%3;if(isEncrypt){let d32=dv.getUint32(i*4,true);let opA=(d32+g32)>>>0;let opS=(d32-g32)>>>0;let opX=(d32^g32)>>>0;d32=(opA&((opMode===0)?0xFFFFFFFF:0))|(opS&((opMode===1)?0xFFFFFFFF:0))|(opX&((opMode===2)?0xFFFFFFFF:0));dv.setUint32(i*4,d32,true);G3=(G3^d32)>>>0;}else{let c32=dv.getUint32(i*4,true);let opA=(c32-g32)>>>0;let opS=(c32+g32)>>>0;let opX=(c32^g32)>>>0;let p32=(opA&((opMode===0)?0xFFFFFFFF:0))|(opS&((opMode===1)?0xFFFFFFFF:0))|(opX&((opMode===2)?0xFFFFFFFF:0));dv.setUint32(i*4,p32,true);G3=(G3^c32)>>>0;}}let rem=buffer.length%4;if(rem>0){let off=buffer.length-rem;for(let i=0;i<rem;i++){let sizeNum=baseWordIndex+words+i+1;let x=sizeNum;let x2=Math.imul(x,x)>>>0;let x3=Math.imul(x2,x)>>>0;let x4=Math.imul(x3,x)>>>0;let x5=Math.imul(x4,x)>>>0;let x6=Math.imul(x5,x)>>>0;let x7=Math.imul(x6,x)>>>0;let x8=Math.imul(x7,x)>>>0;let pMode=bigKey[sizeNum%128]%6;let tVal=(pMode===0)?x3:(pMode===1)?x4:(pMode===2)?x5:(pMode===3)?x6:(pMode===4)?x7:x8;let pVal=bigKey[(sizeNum+5)%128];let rIn=(Math.imul(pVal,Math.imul(pVal,pVal))>>>0)%7+1;let rOut=(Math.imul(tVal%100,tVal%100)+rIn)%7+1;G1=(G1+tVal)>>>0;let gCombined=(G1^G2^G3^G4)>>>0;gCombined=((gCombined<<rIn)|(gCombined>>>(32-rIn)))>>>0;gCombined=((gCombined<<rOut)|(gCombined>>>(32-rOut)))>>>0;let pwdGarbageByte=bigKey[(sizeNum*7)%128];let gByte=((gCombined+pwdGarbageByte+(Math.imul(sizeNum%100,sizeNum%100)>>>0))&0xFF)^(pwdGarbageByte>>2);let opMode=bigKey[(sizeNum+32)%128]%3;if(isEncrypt){let dB=buffer[off+i];let oA=(dB+gByte)&0xFF;let oS=(dB-gByte+256)&0xFF;let oX=(dB^gByte)&0xFF;dB=(opMode===0)?oA:((opMode===1)?oS:oX);buffer[off+i]=dB;G3=(G3^dB)>>>0;}else{let cB=buffer[off+i];let oA=(cB-gByte+256)&0xFF;let oS=(cB+gByte)&0xFF;let oX=(cB^gByte)&0xFF;let pB=(opMode===0)?oA:((opMode===1)?oS:oX);buffer[off+i]=pB;G3=(G3^cB)>>>0;}}}self.postMessage({type:'chunk_done',buffer:buffer.buffer,chunkIdx:chunkIdx},[buffer.buffer]);};`;

    async function runISBText(text, password, isEncrypt) {
        return new Promise((resolve, reject) => {
            let buffer = isEncrypt ? new TextEncoder().encode(text) : base64ToUint8(text);
            let salt = isEncrypt ? crypto.getRandomValues(new Uint8Array(32)) : buffer.slice(0, 32);
            if (!isEncrypt) buffer = buffer.slice(32);
            let kw = new Worker(URL.createObjectURL(new Blob([keyWorkerCode], {type:'application/javascript'})));
            kw.onmessage = function(e) {
                let bigKey = e.data.bigKey; kw.terminate();
                let mw = new Worker(URL.createObjectURL(new Blob([mathWorkerCode], {type:'application/javascript'})));
                mw.onmessage = function(e2) {
                    mw.terminate(); let outBuf = new Uint8Array(e2.data.buffer);
                    if (isEncrypt) { let finalArr = new Uint8Array(32 + outBuf.length); finalArr.set(salt, 0); finalArr.set(outBuf, 32); resolve(btoa(String.fromCharCode.apply(null, finalArr))); } 
                    else { resolve(new TextDecoder().decode(outBuf)); }
                };
                mw.postMessage({buffer: buffer.buffer, action: isEncrypt ? 'encrypt' : 'bigKey', bigKey: bigKey, chunkIdx: 0}, [buffer.buffer, bigKey]);
            };
            kw.postMessage({password: password, salt: salt.buffer});
        });
    }

    function getMediaBlobUrl(dataURI) {
        let parts = dataURI.split(','); let byteString = atob(parts[1]); let mime = parts[0].match(/:(.*?);/)[1];
        let ab = new ArrayBuffer(byteString.length); let ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
        return URL.createObjectURL(new Blob([ab], {type: mime}));
    }

    function closeMediaViewer() { document.getElementById('mediaViewerModal').style.display = 'none'; document.getElementById('mediaViewerContent').innerHTML = ""; }
    
    // [ADD OTHER FUNCTIONS: appendSingleMessage, sendChatMessage, loadChatsList, etc. HERE]
</script>
</body>
</html>
