    <style>
        /* (यही वाला CSS रहेगा जो पहले था, बस इसे आप पूरे कोड में रखें - यहाँ जगह के लिए छोटा कर रहा हूँ) */

<script>
    // --- आपकी FIREBASE चाबी ---

        apiKey: "AIzaSyA-d_mtHg1Age9ZggTWF3ABhUd_xn2PDKM",
        authDomain: "isb-messenger-75093.firebaseapp.com",
        databaseURL: "https://isb-messenger-75093-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "isb-messenger-75093",
        storageBucket: "isb-messenger-75093.firebasestorage.app",
        messagingSenderId: "970755431087",
        appId: "1:970755431087:web:09171e2ebca48e1b91125a"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // --- ब्लैकबॉक्स एन्क्रिप्शन वर्कर (आपका कचरा सिस्टम) ---
    const keyWorkerCode = `self.onmessage=function(e){let pwd=e.data.password;let salt=new Uint8Array(e.data.salt);let bigKey=new Uint8Array(128);for(let i=0;i<128;i++){bigKey[i]=pwd.charCodeAt(i%pwd.length)^salt[i%salt.length]^(i%256);}self.postMessage({bigKey:bigKey.buffer},[bigKey.buffer]);};`;
    const mathWorkerCode = `self.onmessage=function(e){/*आपका पिछला पूरा एन्क्रिप्शन कोड यहाँ डालें*/};`; 
    // (नोट: पिछले टर्न वाला पूरा mathWorkerCode यहाँ पेस्ट करें)

    async function sendChatMessage() {
        let msg = document.getElementById('chatInputMsg').value;
        if(!msg) return;

        // 1. एन्क्रिप्ट करें
        let encrypted = await runISBText(msg, currentUserEmail, true);

        // 2. Firebase में भेजें
        database.ref('messages').push({
            from: currentUserEmail,
            to: currentChatContact,
            payload: encrypted,
            time: new Date().toLocaleTimeString()
        });
        document.getElementById('chatInputMsg').value = "";
    }

    // 3. लाइव सुनने का सिस्टम (Listener)
    database.ref('messages').on('child_added', async function(snapshot) {
        let m = snapshot.val();
        // अगर मैसेज मेरे लिए है या मैंने भेजा है
        if((m.from === currentUserEmail && m.to === currentChatContact) || 
           (m.from === currentChatContact && m.to === currentUserEmail)) {
            
            // डीक्रिप्ट करें
            let decrypted = await runISBText(m.payload, m.from === currentUserEmail ? currentUserEmail : m.from, false);
            renderMessageToUI(decrypted, m.from === currentUserEmail);
        }
    });

    function renderMessageToUI(text, isMe) {
        let box = document.getElementById('chatMessagesBox');
        box.innerHTML += `<div class="bubble ${isMe ? 'sent' : 'received'}">${text}</div>`;
        box.scrollTop = box.scrollHeight;
    }
</script>
