    <style>
        /* BRAHMA CORE FONTS */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        /* 12 PREMIUM THEMES */
        :root { --primary: #3F51B5; --bg: #f0f2f5; --surface: #ffffff; --text: #1c1e21; --text-muted: #65676B; --border: #e4e6eb; --msg-sent: #E8EAF6; --msg-recv: #ffffff; --nav-bg: #ffffff; }
        [data-theme="dark"] { --primary: #5C6BC0; --bg: #121212; --surface: #1e1e1e; --text: #e4e6eb; --text-muted: #b0b3b8; --border: #333333; --msg-sent: #2c387e; --msg-recv: #242526; --nav-bg: #1e1e1e; }
        [data-theme="telegram"] { --primary: #2AABEE; --bg: #f4f4f4; --surface: #ffffff; --text: #222222; --border: #e0e0e0; }
        [data-theme="sunset"] { --primary: #FF5722; --bg: #fdf8f5; --surface: #ffffff; --text: #3e2723; --border: #fbe9e7; }
        [data-theme="forest"] { --primary: #2E7D32; --bg: #f1f8e9; --surface: #ffffff; --text: #1b5e20; --border: #c8e6c9; }
        [data-theme="ruby"] { --primary: #E91E63; --bg: #fce4ec; --surface: #ffffff; --text: #4a148c; --border: #f8bbd0; }
        [data-theme="cyberpunk"] { --primary: #00E5FF; --bg: #09090b; --surface: #17171c; --text: #00E5FF; --border: #006064; }
        [data-theme="amoled"] { --primary: #ffffff; --bg: #000000; --surface: #0a0a0a; --text: #ffffff; --border: #222222; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; height: 100dvh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0;}
        
        #authScreen { height: 100%; height: 100dvh; display:flex; align-items:center; justify-content:center; }
        #mainApp { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
        
        .app-bar { flex-shrink: 0; background-color: var(--surface); color: var(--primary); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; border-bottom: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,0.05);}
        .app-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .app-bar-icons { display: flex; gap: 15px; align-items: center; }
        .app-bar i { font-size: 24px; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
        
        .container { flex: 1; overflow-y: auto; padding-bottom: 70px; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }

        .list-item { display: flex; align-items: center; padding: 15px 20px; cursor: pointer; background: var(--surface); transition: 0.2s; margin: 5px 10px; border-radius: 12px;}
        .avatar { width: 54px; height: 54px; background: var(--primary); color: var(--surface); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; margin-right: 15px; flex-shrink: 0;}
        .list-info { flex: 1; overflow: hidden; }
        .list-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .list-subtitle { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .list-time { font-size: 12px; color: var(--text-muted); font-weight: 500; }

        .fab { position: fixed; bottom: 85px; right: 20px; width: 60px; height: 60px; background: #25D366; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.15); cursor: pointer; z-index: 90;}
        .fab-secondary { bottom: 160px; background: var(--surface); color: var(--primary); border: 1px solid var(--border); }
        .fab-pencil { position: fixed; bottom: 160px; right: 28px; width: 45px; height: 45px; background: var(--surface); color: var(--text-muted); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.15); cursor: pointer; z-index: 90; border: 1px solid var(--border);}

        .bottom-nav { flex-shrink: 0; background: var(--nav-bg); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border); z-index: 100;}
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); cursor: pointer; width: 33.3%;}
        .nav-item span { font-size: 11px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }

        .chat-window { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 200; flex-direction: column; }
        .chat-header { flex-shrink: 0; background: var(--surface); padding: 10px 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border);}
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .chat-input-area { flex-shrink: 0; background: var(--surface); padding: 10px 15px; display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--border);}
        .chat-input-area input[type="text"] { flex: 1; padding: 15px 20px; border-radius: 30px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none;}
        .btn-send { width: 50px; height: 50px; background: var(--primary); color: var(--surface); border-radius: 50%; border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        #selectedFileBar { display: none; padding: 8px 15px; background: var(--surface); border-top: 1px solid var(--border); font-size: 13px; color: var(--primary); align-items: center; justify-content: space-between; }

        .bubble { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; position: relative; word-wrap: break-word;}
        .bubble.sent { align-self: flex-end; background: #DCF8C6; color: #000; border-bottom-right-radius: 4px;}
        .bubble.received { align-self: flex-start; background: white; color: #000; border-bottom-left-radius: 4px; border: 1px solid var(--border);}
        .bubble-time { font-size: 11px; color: gray; text-align: right; margin-top: 5px; display: block;}
        
        .auth-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-box { background: var(--surface); padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); width: 100%; max-width: 380px; text-align: center;}
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;}
        .modal-content { background: var(--surface); width: 90%; max-width: 400px; border-radius: 20px; padding: 25px; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;}
        .input-group input, .input-group textarea { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 20px;}
        
        /* WhatsApp Status Tray */
        .status-tray { display: flex; overflow-x: auto; gap: 12px; padding: 10px 20px; scroll-snap-type: x mandatory; }
        .status-tray::-webkit-scrollbar { display: none; }
        .status-card { width: 105px; height: 150px; border-radius: 16px; background: var(--surface); position: relative; flex-shrink: 0; border: 1px solid var(--border); overflow: hidden; background-size: cover; background-position: center; cursor: pointer;}
        .status-card-avatar { position: absolute; top: 10px; left: 10px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid #25D366; background: var(--surface); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--text); z-index: 2;}
        .status-card-name { position: absolute; bottom: 10px; left: 10px; right: 10px; font-size: 12px; font-weight: 700; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2;}
        .status-card-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.8)); z-index: 1;}

        /* --- ISB-24 MEDIA ENGINE VIEWER --- */
        .wa-status-viewer { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 4000; flex-direction: column; color: white;}
        .wa-header { display:flex; justify-content:space-between; align-items:center; padding:20px 15px; position:absolute; top:5px; width:100%; z-index:4002; background:linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);}
        .wa-content { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; overflow: hidden;}
        
        .brahma-player-section { background: #0a0a0a; border: 2px solid #00ffcc; padding: 20px; border-radius: 16px; width: 90%; max-width: 650px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); box-sizing: border-box; font-family: 'Share Tech Mono', monospace; margin: auto; z-index: 4005; }
        .brahma-section-title { font-weight: bold; font-size: 16px; margin-bottom: 15px; color: #00ffcc; border-left: 4px solid #00ffcc; padding-left: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .brahma-preview-area { text-align: center; padding: 15px; background: #111111; border: 1px solid #004400; border-radius: 12px; overflow: hidden; }
        .brahma-video { width: 100%; max-height: 500px; border-radius: 8px; background: #000; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); object-fit: contain; }
        .brahma-status-text { color: #00ffcc; font-weight: bold; margin-bottom: 10px; font-size: 13px; }
    </style>
</head>
<body data-theme="default">

    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <i class="material-icons shield-icon" style="font-size:70px; color:var(--primary);">fingerprint</i>
            <h2 style="font-weight:800;">ISB Premium</h2>
            <p style="color:var(--text-muted); font-size:14px; margin-bottom:30px;">End-to-End Encrypted Web3 Network.</p>
            <div id="googleButtonContainer" style="display: flex; justify-content: center; min-height:50px;"></div>
        </div>
    </div>

    <div id="mainApp" style="display: none;">
        <div class="app-bar">
            <div class="app-title">ISB Messenger</div>
            <div class="app-bar-icons">
                <i class="material-icons" onclick="syncDrive()" id="syncIcon">sync</i>
            </div>
        </div>
        
        <div class="container">
            <div id="chatsTab" class="tab-content active">
                <div id="chatsList"></div>
                <div class="fab fab-secondary" onclick="openNewGroupModal()"><i class="material-icons">group_add</i></div>
                <div class="fab" onclick="openNewChatModal()"><i class="material-icons">add_comment</i></div>
            </div>

            <div id="statusTab" class="tab-content">
                <div class="status-tray" id="statusTray"></div>
                <div id="statusList"></div>
                <div class="fab-pencil" onclick="openTextStatusModal()"><i class="material-icons">edit</i></div>
                <div class="fab" onclick="openImageStatusModal()"><i class="material-icons">camera_alt</i></div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchNav('chatsTab', this)"><i class="material-icons">chat_bubble</i><span>Chats</span></div>
            <div class="nav-item" onclick="switchNav('statusTab', this)"><i class="material-icons">donut_large</i><span>Status</span></div>
        </div>
    </div>

    <!-- CHAT WINDOW -->
    <div id="chatWindow" class="chat-window">
        <div class="chat-header">
            <i class="material-icons" onclick="closeChat()">arrow_back_ios_new</i>
            <div class="avatar" id="chatAvatar" style="width:42px; height:42px;">U</div>
            <div style="flex:1;"><div style="font-size:17px; font-weight:700;" id="chatTitle">User</div></div>
        </div>
        <div class="chat-messages" id="chatMessagesBox"></div>
        <div id="selectedFileBar"><span id="selectedFileNameDisplay">File selected</span><i class="material-icons" style="cursor:pointer;" onclick="cancelSelectedFile()">close</i></div>
        <div class="chat-input-area">

            <button class="btn-send" onclick="sendChatMessage()"><i class="material-icons">send</i></button>
        </div>
    </div>

    <!-- UNIVERSAL MEDIA VIEWER ENGINE -->
    <div id="waStatusViewer" class="wa-status-viewer">
        <div class="wa-header">
            <div style="display:flex; align-items:center; gap:12px; cursor:pointer; z-index:4005;" onclick="closeWaStatus()">
                <i class="material-icons">arrow_back</i>

<script>

    const ISB_CLIENT_ID = "1091629496669-5881hgv7d4t01eepcq60u8mmdkguc1cn.apps.googleusercontent.com";
    const firebaseConfig = { apiKey: "AIzaSyA-d_mtHg1Age9ZggTWF3ABhUd_xn2PDKM", authDomain: "isb-messenger-75093.firebaseapp.com", databaseURL: "https://isb-messenger-75093-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "isb-messenger-75093", storageBucket: "isb-messenger-75093.firebasestorage.app", messagingSenderId: "970755431087", appId: "1:970755431087:web:09171e2ebca48e1b91125a" };

    let isListeningToFirebase = false;

    window.onload = function() {

        else {
            if(typeof google !== 'undefined') { try { google.accounts.id.initialize({ client_id: ISB_CLIENT_ID, callback: handleCredentialResponse }); google.accounts.id.renderButton(document.getElementById("googleButtonContainer"), { theme: "filled_blue", size: "large", text: "continue_with" }); } catch(e) {} }
        }
    };

    function handleCredentialResponse(response) {
        try {
            let base64 = response.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
            currentUserEmail = JSON.parse(jsonPayload).email; localStorage.setItem("isb_email", currentUserEmail); showMainApp();
        } catch(e) { alert("Login Failed"); }
    }
    
    function showMainApp() {
        document.getElementById('authScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'flex';
        startFirebaseSync();
    }

    function startFirebaseSync() {
        if(isListeningToFirebase) return; isListeningToFirebase = true;
        database.ref('messages').on('child_added', function(snapshot) {
            let m = snapshot.val(); if(!m) return;
            if (!APP_STATE.msgs.some(msg => msg.id === m.id)) {
                let isMyGroupMsg = m.isGroup && APP_STATE.groups.some(g => g.id === m.to);
                let isPersonalMsg = !m.isGroup && (m.from === currentUserEmail || m.to === currentUserEmail);
                if (isMyGroupMsg || isPersonalMsg) {
                    APP_STATE.msgs.push(m); loadChatsList();
                    if(currentChatContact && ((!m.isGroup && ((m.from===currentUserEmail && m.to===currentChatContact) || (m.from===currentChatContact && m.to===currentUserEmail))) || (m.isGroup && m.to===currentChatContact))) appendSingleMessage(m);
                }
            }
        });
        database.ref('groups').on('child_added', function(snapshot) {
            let g = snapshot.val();
            if(g && g.members.includes(currentUserEmail)) { if(!APP_STATE.groups.some(grp => grp.id === g.id)) { APP_STATE.groups.push(g); loadChatsList(); } }
        });
        database.ref('statuses').on('child_added', function(snapshot) {
            let s = snapshot.val();
            if(s) { if(!APP_STATE.statuses.some(st => st.id === s.id)) { APP_STATE.statuses.push(s); loadStatusList(); } }
        });
    }

    const mathWorkerCode = `self.onmessage=function(e){let buffer=new Uint8Array(e.data.buffer);let isEncrypt=e.data.action==='encrypt';let bigKey=new Uint8Array(e.data.bigKey);let chunkIdx=e.data.chunkIdx;let G1=0x12345678,G2=0x87654321,G3=0xDEADBEEF,G4=0xCAFEBABE;for(let i=0;i<128;i++){let c=bigKey[i];G1=(G1>>>1)^(c<<24);G2=(G2<<3)^c;G3^=(G1>>>5);G4=(G4<<1)^(G2>>>2);}G1^=chunkIdx;G2^=(Math.imul(chunkIdx,13)>>>0);G3^=(Math.imul(chunkIdx,17)>>>0);G4^=(Math.imul(chunkIdx,19)>>>0);let dv=new DataView(buffer.buffer,buffer.byteOffset,buffer.byteLength);let words=Math.floor(buffer.length/4);let baseWordIndex=chunkIdx*1048576;for(let i=0;i<words;i++){let sizeNum=baseWordIndex+i+1;let x=sizeNum;let x2=Math.imul(x,x)>>>0;let x3=Math.imul(x2,x)>>>0;let x4=Math.imul(x3,x)>>>0;let x5=Math.imul(x4,x)>>>0;let x6=Math.imul(x5,x)>>>0;let x7=Math.imul(x6,x)>>>0;let x8=Math.imul(x7,x)>>>0;let pMode=bigKey[sizeNum%128]%6;let powerVal=(x3&((pMode===0)?0xFFFFFFFF:0))|(x4&((pMode===1)?0xFFFFFFFF:0))|(x5&((pMode===2)?0xFFFFFFFF:0))|(x6&((pMode===3)?0xFFFFFFFF:0))|(x7&((pMode===4)?0xFFFFFFFF:0))|(x8&((pMode===5)?0xFFFFFFFF:0));let pVal=bigKey[(sizeNum+15)%128];let rotInner=(Math.imul(pVal,Math.imul(pVal,pVal))>>>0)%31+1;let rotOuter=(Math.imul(powerVal%1000,powerVal%1000)+rotInner)%31+1;G1=(G1+powerVal)>>>0;G2=(G2^G1)>>>0;G2=((G2<<rotInner)|(G2>>>(32-rotInner)))>>>0;G3=(G3+G2)>>>0;G4=(G4^G3)>>>0;G4=((G4<<rotOuter)|(G4>>>(32-rotOuter)))>>>0;let g32=(G1+G2+G3+G4)>>>0;let y=(g32%10000)+1;let y2=Math.imul(y,y)>>>0;let y3=Math.imul(y2,y)>>>0;let y4=Math.imul(y3,y)>>>0;let y5=Math.imul(y4,y)>>>0;let y6=Math.imul(y5,y)>>>0;let y7=Math.imul(y6,y)>>>0;let y8=Math.imul(y7,y)>>>0;let dpMode=bigKey[(sizeNum+64)%128]%6;let dPowerVal=(y3&((dpMode===0)?0xFFFFFFFF:0))|(y4&((dpMode===1)?0xFFFFFFFF:0))|(y5&((dpMode===2)?0xFFFFFFFF:0))|(y6&((dpMode===3)?0xFFFFFFFF:0))|(y7&((dpMode===4)?0xFFFFFFFF:0))|(y8&((dpMode===5)?0xFFFFFFFF:0));let dpVal=bigKey[(sizeNum+42)%128];let dRotInner=(Math.imul(dpVal,Math.imul(dpVal,dpVal))>>>0)%31+1;let dRotOuter=(Math.imul(dPowerVal%1000,dPowerVal%1000)+dRotInner)%31+1;g32=(g32+dPowerVal)>>>0;g32=(g32^(g32>>>15))>>>0;g32=((g32<<dRotInner)|(g32>>>(32-dRotInner)))>>>0;g32=((g32<<dRotOuter)|(g32>>>(32-dRotOuter)))>>>0;let pwdGarbage=(bigKey[(sizeNum*7)%128])|(bigKey[(sizeNum*11)%128]<<8)|(bigKey[(sizeNum*13)%128]<<16)|(bigKey[(sizeNum*17)%128]<<24);g32=(g32+pwdGarbage)>>>0;g32=(g32^(pwdGarbage>>>7))>>>0;let opMode=bigKey[(sizeNum+32)%128]%3;if(isEncrypt){let d32=dv.getUint32(i*4,true);let opA=(d32+g32)>>>0;let opS=(d32-g32)>>>0;let opX=(d32^g32)>>>0;d32=(opA&((opMode===0)?0xFFFFFFFF:0))|(opS&((opMode===1)?0xFFFFFFFF:0))|(opX&((opMode===2)?0xFFFFFFFF:0));dv.setUint32(i*4,d32,true);G3=(G3^d32)>>>0;}else{let c32=dv.getUint32(i*4,true);let opA=(c32-g32)>>>0;let opS=(c32+g32)>>>0;let opX=(c32^g32)>>>0;let p32=(opA&((opMode===0)?0xFFFFFFFF:0))|(opS&((opMode===1)?0xFFFFFFFF:0))|(opX&((opMode===2)?0xFFFFFFFF:0));dv.setUint32(i*4,p32,true);G3=(G3^c32)>>>0;}}let rem=buffer.length%4;if(rem>0){let off=buffer.length-rem;for(let i=0;i<rem;i++){let sizeNum=baseWordIndex+words+i+1;let x=sizeNum;let x2=Math.imul(x,x)>>>0;let x3=Math.imul(x2,x)>>>0;let x4=Math.imul(x3,x)>>>0;let x5=Math.imul(x4,x)>>>0;let x6=Math.imul(x5,x)>>>0;let x7=Math.imul(x6,x)>>>0;let x8=Math.imul(x7,x)>>>0;let pMode=bigKey[sizeNum%128]%6;let tVal=(pMode===0)?x3:(pMode===1)?x4:(pMode===2)?x5:(pMode===3)?x6:(pMode===4)?x7:x8;let pVal=bigKey[(sizeNum+5)%128];let rIn=(Math.imul(pVal,Math.imul(pVal,pVal))>>>0)%7+1;let rOut=(Math.imul(tVal%100,tVal%100)+rIn)%7+1;G1=(G1+tVal)>>>0;let gCombined=(G1^G2^G3^G4)>>>0;gCombined=((gCombined<<rIn)|(gCombined>>>(32-rIn)))>>>0;gCombined=((gCombined<<rOut)|(gCombined>>>(32-rOut)))>>>0;let pwdGarbageByte=bigKey[(sizeNum*7)%128];let gByte=((gCombined+pwdGarbageByte+(Math.imul(sizeNum%100,sizeNum%100)>>>0))&0xFF)^(pwdGarbageByte>>2);let opMode=bigKey[(sizeNum+32)%128]%3;if(isEncrypt){let dB=buffer[off+i];let oA=(dB+gByte)&0xFF;let oS=(dB-gByte+256)&0xFF;let oX=(dB^gByte)&0xFF;dB=(opMode===0)?oA:((opMode===1)?oS:oX);buffer[off+i]=dB;G3=(G3^dB)>>>0;}else{let cB=buffer[off+i];let oA=(cB-gByte+256)&0xFF;let oS=(cB+gByte)&0xFF;let oX=(cB^gByte)&0xFF;let pB=(opMode===0)?oA:((opMode===1)?oS:oX);buffer[off+i]=pB;G3=(G3^cB)>>>0;}}}self.postMessage({type:'chunk_done',buffer:buffer.buffer,chunkIdx:chunkIdx},[buffer.buffer]);};`;
    function base64ToUint8(base64) { let binary = atob(base64.replace(/\s+/g, '')); let len = binary.length; let bytes = new Uint8Array(len); for (let i = 0; i < len; i++) { bytes[i] = binary.charCodeAt(i); } return bytes; }
    function uint8ToBase64(bytes) { let binary = ''; let len = bytes.byteLength; let chunkSize = 0x8000; for (let i = 0; i < len; i += chunkSize) { binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunkSize, len))); } return btoa(binary); }

    async function runISBText(text, password, isEncrypt) {
        return new Promise((resolve, reject) => {
            let buffer, salt;
            if (isEncrypt) { buffer = new TextEncoder().encode(text); salt = crypto.getRandomValues(new Uint8Array(32)); } 
            else { try { buffer = base64ToUint8(text); } catch(e) { reject("Invalid Code"); return; } salt = buffer.slice(0, 32); buffer = buffer.slice(32); }
            let kw = new Worker(URL.createObjectURL(new Blob([keyWorkerCode], {type:'application/javascript'})));
            kw.onmessage = function(e) {
                let bigKey = e.data.bigKey; kw.terminate();
                let mw = new Worker(URL.createObjectURL(new Blob([mathWorkerCode], {type:'application/javascript'})));
                mw.onmessage = function(e2) {
                    mw.terminate(); let outBuf = new Uint8Array(e2.data.buffer);
                    if (isEncrypt) { let finalArr = new Uint8Array(32 + outBuf.length); finalArr.set(salt, 0); finalArr.set(outBuf, 32); resolve(uint8ToBase64(finalArr)); } 
                    else { resolve(new TextDecoder().decode(outBuf)); }
                };
                mw.postMessage({buffer: buffer.buffer, action: isEncrypt ? 'encrypt' : 'bigKey', bigKey: bigKey, chunkIdx: 0}, [buffer.buffer, bigKey]);
            };
            kw.postMessage({password: password, salt: salt.buffer});
        });
    }

    /* ==========================================
       THE "BLOB" RAM CONVERTER (For Video Player ONLY)
       यह कोड ISB-24 के डिक्रिप्टेड टेक्स्ट को फोन की रैम में 
       एक लोकल URL (Virtual File) में बदल देता है।
       ========================================== */
    function base64ToBlobUrl(base64Data) {
        try {
            let arr = base64Data.split(',');
            let mime = arr[0].match(/:(.*?);/)[1];
            let bstr = atob(arr[1]);
            let n = bstr.length;
            let u8arr = new Uint8Array(n);
            for(let i=0; i<n; i++){
                u8arr[i] = bstr.charCodeAt(i);
            }
            let blob = new Blob([u8arr], {type: mime});
            return URL.createObjectURL(blob);
        } catch(e) {
            console.error("Blob Error", e);
            return base64Data; 
        }
    }

    // --- CHAT SYSTEM ---
    function handleFileSelect(event) {
        let file = event.target.files[0]; if(!file) return;
        if(file.size > 5 * 1024 * 1024) return alert("⚠️ Max File Size 5MB.");
        let reader = new FileReader();
        reader.onload = function(e) {
            selectedFileData = e.target.result; selectedFileName = file.name;
            document.getElementById('selectedFileNameDisplay').innerText = `📎 ${file.name} (${(file.size/1024).toFixed(1)} KB)`;
            document.getElementById('selectedFileBar').style.display = 'flex';
        };
        reader.readAsDataURL(file);
    }
    function cancelSelectedFile() { selectedFileData = null; selectedFileName = null; document.getElementById('fileAttachment').value = ""; document.getElementById('selectedFileBar').style.display = 'none'; }
    function openNewChatModal() { document.getElementById('newChatModal').style.display = 'flex'; }
    function startNewChat() {
        let email = document.getElementById('newChatEmail').value.trim().toLowerCase();
        if(!email || !email.includes("@")) return alert("Enter valid Gmail!");
        document.getElementById('newChatModal').style.display = 'none'; openChat(email, false);
    }
    function openNewGroupModal() { document.getElementById('newGroupModal').style.display = 'flex'; }
    function createGroup() {
        let gName = document.getElementById('newGroupName').value.trim();
        let gEmails = document.getElementById('newGroupEmails').value.toLowerCase().split(',').map(e => e.trim()).filter(e => e.includes('@'));
        if(!gName || gEmails.length === 0) return alert("Enter valid name and at least 1 email");
        gEmails.push(currentUserEmail); 
        database.ref('groups').push({ id: 'grp_' + Date.now(), name: gName, members: [...new Set(gEmails)], createdBy: currentUserEmail });
        document.getElementById('newGroupModal').style.display = 'none'; alert("Group created securely!");
    }
    function loadChatsList() {
        let contacts = {};
        APP_STATE.msgs.forEach(m => {
            if(!m.isGroup && (m.from === currentUserEmail || m.to === currentUserEmail)) {
                let other = (m.from === currentUserEmail) ? m.to : m.from;
                if(!contacts[other]) contacts[other] = { email: other, name: other, lastMsg: m.payload.length > 500 ? "📁 Media / File" : "🔒 Encrypted Message", time: m.time, isGroup: false };
                else { contacts[other].time = m.time; contacts[other].lastMsg = m.payload.length > 500 ? "📁 Media / File" : "🔒 Encrypted Message"; }
            }
        });
        APP_STATE.groups.forEach(g => { contacts[g.id] = { email: g.id, name: g.name + " (Group)", lastMsg: "Tap to view group", time: "Active", isGroup: true }; });
        let html = "";
        for(let c in contacts) {
            let info = contacts[c]; let avatarChar = info.isGroup ? "G" : info.email.charAt(0);
            html += `<div class="list-item" onclick="openChat('${info.email}', ${info.isGroup}, '${info.name}')"><div class="avatar">${avatarChar}</div><div class="list-info"><div class="list-title">${info.name}</div><div class="list-subtitle"><i class="material-icons" style="font-size:14px; color:var(--primary);">lock</i> ${info.lastMsg}</div></div><div class="list-time">${info.time.split(',')[1] || info.time}</div></div>`;
        }
        document.getElementById("chatsList").innerHTML = html || `<div style="text-align:center; padding:20px; color:gray;">No Messages Yet</div>`;
    }
    function openChat(id, isGroup, chatName = null) {
        currentChatContact = id; isGroupChat = isGroup;
        document.getElementById('chatTitle').innerText = chatName ? chatName : id; document.getElementById('chatAvatar').innerText = isGroup ? "G" : id.charAt(0).toUpperCase();
        document.getElementById('chatWindow').style.display = 'flex';
        cancelSelectedFile(); document.getElementById('chatInputMsg').value = ""; document.getElementById('chatInputMsg').disabled = false; renderChatMessages();
    }
    function closeChat() { document.getElementById('chatWindow').style.display = 'none'; currentChatContact = null; isGroupChat = false; cancelSelectedFile(); loadChatsList(); }
    
    function renderChatMessages() {
        let box = document.getElementById('chatMessagesBox'); box.innerHTML = "";
        let chatHistory = APP_STATE.msgs.filter(m => { return isGroupChat ? m.isGroup && m.to === currentChatContact : !m.isGroup && ((m.from === currentUserEmail && m.to === currentChatContact) || (m.from === currentChatContact && m.to === currentUserEmail)); });
        chatHistory.forEach(m => { appendSingleMessage(m); });
        setTimeout(() => box.scrollTop = box.scrollHeight, 100);
    }

    async function appendSingleMessage(m) {
        let box = document.getElementById('chatMessagesBox'); if(document.getElementById(`msg_${m.id}`)) return;
        let isSentByMe = (m.from === currentUserEmail), cls = isSentByMe ? "sent" : "received", timeStr = m.time.split(',')[1] || m.time;
        let bubble = document.createElement('div'); bubble.className = `bubble ${cls}`; bubble.id = `msg_${m.id}`;
        let senderHtml = (!isSentByMe && m.isGroup) ? `<span class="sender-name">${m.from}</span>` : "";
        bubble.innerHTML = `${senderHtml}<span style="font-size:12px;"><i class="material-icons animate-spin" style="font-size:12px; vertical-align:middle;">sync</i> Decrypting...</span> <span class="bubble-time">${timeStr}</span>`;
        box.appendChild(bubble); box.scrollTop = box.scrollHeight;
        
        let pwd = isGroupChat ? m.to : m.from; 
        try {
            let decrypted = m.decryptedFullText || await runISBText(m.payload, pwd, false);
            m.decryptedFullText = decrypted; 
            if(decrypted.startsWith("ISB_FILE|||")) {
                let parts = decrypted.split("|||"); m.decryptedName = parts[1]; m.decryptedData = parts[2];
                let isImg = m.decryptedData.startsWith("data:image/");
                let isVid = m.decryptedData.startsWith("data:video/");
                let content = "";
                
                if(isImg || isVid) {
                    if(isImg) {
                        content = `<img src="${m.decryptedData}" style="max-width:100%; max-height:250px; border-radius:8px; cursor:pointer; display:block; object-fit:contain;" onclick="openMediaViewer('${m.id}', 'msg')">`;
                    } else {
                        content = `<div style="position:relative; cursor:pointer;" onclick="openMediaViewer('${m.id}', 'msg')"><div style="width:200px; height:150px; background:#000; border-radius:8px; display:flex; align-items:center; justify-content:center;"><i class="material-icons" style="font-size:50px; color:#00ffcc;">play_circle_outline</i></div><div style="font-size:11px; margin-top:5px; color:gray;">${m.decryptedName}</div></div>`;
                    }
                } else {
                    let iconType = m.decryptedData.startsWith("data:application/pdf") ? "picture_as_pdf" : "insert_drive_file";
                    content = `<div style="display:flex; gap:10px; align-items:center; cursor:pointer; background:rgba(0,0,0,0.03); padding:10px; border-radius:8px;" onclick="openMediaViewer('${m.id}', 'msg')">
                        <i class="material-icons" style="font-size:30px; color:var(--primary);">${iconType}</i>
                        <div><div style="font-weight:bold; font-size:14px; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${m.decryptedName}</div></div>
                    </div>`;
                }
                document.getElementById(`msg_${m.id}`).innerHTML = `${senderHtml}${content}<span class="bubble-time">${timeStr}</span>`;
            } else { document.getElementById(`msg_${m.id}`).innerHTML = `${senderHtml}${decrypted} <span class="bubble-time">${timeStr}</span>`; }
        } catch(e) { document.getElementById(`msg_${m.id}`).innerHTML = `${senderHtml}<span style="color:red; font-size:13px;">Corrupted</span>`; }
    }

    async function sendChatMessage() {
        let input = document.getElementById('chatInputMsg'), msg = input.value.trim(), payloadToEncrypt = "";
        if(selectedFileData) { payloadToEncrypt = `ISB_FILE|||${selectedFileName}|||${selectedFileData}`; } else { if(!msg) return; payloadToEncrypt = msg; }
        let sendBtn = document.querySelector('.btn-send'); sendBtn.disabled = true; input.disabled = true;
        try {
            let encryptionPwd = isGroupChat ? currentChatContact : currentUserEmail; 
            let encryptedPayload = await runISBText(payloadToEncrypt, encryptionPwd, true);
            await database.ref('messages').push({ id: Date.now() + Math.random().toString().substring(2,8), from: currentUserEmail, to: currentChatContact, payload: encryptedPayload, time: new Date().toLocaleString(), isGroup: isGroupChat });
            input.value = ""; cancelSelectedFile(); sendBtn.disabled = false; input.disabled = false; input.focus();
            setTimeout(() => { document.getElementById('chatMessagesBox').scrollTop = document.getElementById('chatMessagesBox').scrollHeight; }, 100);
        } catch(e) { alert("Encryption Error"); sendBtn.disabled = false; input.disabled = false; }
    }

    function openTextStatusModal() { document.getElementById('textStatusModal').style.display = 'flex'; document.getElementById('statusTextOnly').value = ""; }
    function openImageStatusModal() { document.getElementById('imageStatusModal').style.display = 'flex'; statusFileData = null; }
    function handleStatusFile(event) {
        let file = event.target.files[0]; if(!file) return;
        let reader = new FileReader(); reader.onload = function(e) { statusFileData = e.target.result; }; reader.readAsDataURL(file);
    }
    
    async function postStatus(type) {
        let payloadToEncrypt = "";
        if(type === 'text') {
            let txt = document.getElementById('statusTextOnly').value.trim(); if(!txt) return;
            payloadToEncrypt = `ISB_TXT_STATUS|||${txt}`; document.getElementById('textStatusModal').style.display = 'none';
        } else {
            if(!statusFileData) return; let cap = document.getElementById('statusCaption').value.trim();
            payloadToEncrypt = `ISB_IMG_STATUS|||${statusFileData}|||${cap}`; document.getElementById('imageStatusModal').style.display = 'none';
        }
        let encrypted = await runISBText(payloadToEncrypt, currentUserEmail, true); 
        await database.ref('statuses').push({ id: 'sts_' + Date.now(), from: currentUserEmail, payload: encrypted, timestamp: Date.now(), timeStr: new Date().toLocaleTimeString() }); 
    }
    
    async function loadStatusList() {
        let trayHtml = `<div class="status-card" onclick="openImageStatusModal()"><div class="status-card-avatar" style="border:none;"><div style="background:white; width:100%; height:100%; border-radius:50%; display:flex; align-items:center; justify-content:center;">+</div></div><div class="status-card-name">Add Status</div></div>`;
        document.getElementById('statusTray').innerHTML = trayHtml;
    }

    // --- 🚨 THE ISB-24 FINAL MEDIA ENGINE 🚨 ---
    let currentPdf = null; let currentPdfPage = 1;

    async function openMediaViewer(msgId, source) {
        document.getElementById('waStatusViewer').style.display = 'flex';
        let m = (source === 'msg') ? APP_STATE.msgs.find(x => x.id === msgId) : window.statusPlaylist.find(x => x.id === msgId);
        let fData = m.decryptedData, fName = m.decryptedName;
        
        document.getElementById('waStatusName').innerText = (source === 'msg') ? "Media Preview" : m.from;
        
        if(source === 'msg') {
            let btn = document.getElementById('waStatusDownloadBtn');
            btn.style.display = 'block'; 
            // Create a blob URL just for downloading safely
            btn.href = base64ToBlobUrl(fData); 
            btn.download = fName;
        }

        let contentBox = document.getElementById('waStatusContent');
        contentBox.innerHTML = `
            <div class="brahma-player-section">
                <div class="brahma-section-title">ISB-24 Core Engine</div>
                <div class="brahma-preview-area" id="brahmaPreviewArea">
                    <div class="material-icons animate-spin" style="font-size:40px; color:#00ffcc;">sync</div>
                    <div class="brahma-status-text" style="margin-top:10px;">DECODING ISB-24 TEXT...</div>
                </div>
            </div>`;

        // UI को लोडिंग दिखाने का समय देते हैं
        setTimeout(() => {
            let previewArea = document.getElementById('brahmaPreviewArea');
            previewArea.innerHTML = `<div class="brahma-status-text">DECRYPTED 0101 RENDERED</div>`;

            // 1. VIDEO PLAYER (यहाँ ISB टेक्स्ट को 'वर्चुअल फाइल' में बदला जा रहा है)
            if(fData.startsWith("data:video/")) {
                let localRamUrl = base64ToBlobUrl(fData);
                previewArea.innerHTML += `<video id="activeVideoPlayer" class="brahma-video" src="${localRamUrl}" controls autoplay playsinline></video>`;
                let video = document.getElementById('activeVideoPlayer');
                
                try {
                    let playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            video.muted = true;
                            video.play().catch(e => { video.controls = true; });
                        });
                    }
                } catch(e) { video.controls = true; }
            } 
            // 2. IMAGE VIEWER
            else if (fData.startsWith("data:image/")) {
                previewArea.innerHTML += `<img src="${fData}" style="max-width:100%; max-height:400px; border-radius:8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); object-fit:contain;">`;
                if(fName && source !== 'msg') previewArea.innerHTML += `<div style="text-align:center; margin-top:15px; color:#00ffcc;">${fName}</div>`;
            } 
        }, 300);
    }

    function closeWaStatus() { document.getElementById('waStatusViewer').style.display = 'none'; document.getElementById('waStatusContent').innerHTML = ""; currentPdf = null; }
