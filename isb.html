<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISB Messenger</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* [आपका पिछला CSS वही रहेगा, बस NAV-ITEM की चौड़ाई 33.3% कर दी है] */
        :root { --primary: #3F51B5; --bg: #f0f2f5; --surface: #ffffff; --text: #1c1e21; --text-muted: #65676B; --border: #e4e6eb; --nav-bg: #ffffff; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); margin: 0; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--nav-bg); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; width: 33.3%; cursor: pointer; color: var(--text-muted); }
        .nav-item.active { color: var(--primary); }
        /* (बाकी स्टाइल वही रखें) */
    </style>
</head>
<body>

    <!-- [AUTH SCREEN - वही रखें] -->
    
    <!-- MAIN APP UI -->
    <div id="mainApp" style="display: none;">
        <div class="app-bar">
            <div class="app-title">ISB Messenger</div>
            <div class="app-bar-icons"><i class="material-icons" onclick="syncDrive()">sync</i></div>
        </div>

        <div class="container">
            <div id="chatsTab" class="tab-content active">
                <div id="chatsList"></div>
                <div class="fab" onclick="openNewChatModal()"><i class="material-icons">add_comment</i></div>
            </div>

            <div id="updatesTab" class="tab-content">
                <div class="empty-state">
                    <h3>Updates Coming Soon</h3>
                    <p>Status sharing is under development.</p>
                </div>
            </div>

            <div id="settingsTab" class="tab-content">
                <!-- (Settings content same as before) -->
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchNav('chatsTab', this)"><i class="material-icons">chat_bubble</i><span>Chats</span></div>
            <div class="nav-item" onclick="switchNav('updatesTab', this)"><i class="material-icons">donut_large</i><span>Updates</span></div>
            <div class="nav-item" onclick="switchNav('settingsTab', this)"><i class="material-icons">settings</i><span>Settings</span></div>
        </div>
    </div>

    <!-- CHAT WINDOW (CALL ICONS REMOVED) -->
    <div id="chatWindow" class="chat-window">
        <div class="chat-header">
            <i class="material-icons" onclick="closeChat()">arrow_back_ios_new</i>
            <div class="avatar" id="chatAvatar">U</div>
            <div style="flex:1;">
                <div style="font-weight:700;" id="chatTitle">User</div>
                <div style="font-size:12px; color:var(--primary);">ISB-24 Secure</div>
            </div>
        </div>
        <div class="chat-messages" id="chatMessagesBox"></div>
        <div class="chat-input-area">
            <input type="file" id="fileAttachment" style="display:none;" onchange="handleFileSelect(event)">
            <i class="material-icons" onclick="document.getElementById('fileAttachment').click()">add</i>
            <input type="text" id="chatInputMsg" placeholder="Message...">
            <button class="btn-send" onclick="sendChatMessage()"><i class="material-icons">send</i></button>
        </div>
    </div>

<script>
    // ... [Firebase और Encryption वाले सारे फंक्शन्स वही रहेंगे] ...
    
    // फाइल साइज़ लिमिट 5MB की गई
    function handleFileSelect(event) {
        let file = event.target.files[0];
        if(!file) return;
        if(file.size > 5 * 1024 * 1024) { alert("⚠️ Max File Size 5MB."); return; } // यहाँ बदलाव किया
        let reader = new FileReader();
        reader.onload = function(e) {
            selectedFileData = e.target.result; 
            selectedFileName = file.name;
            document.getElementById('chatInputMsg').value = `[File: ${file.name}]`;
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
